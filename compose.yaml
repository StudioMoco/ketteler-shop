# Lokale Entwicklungsumgebung (läuft auf Apple Silicon und Intel: alle Bilder sind multi-arch).
# Starten und Einrichten über das Makefile (make setup), nicht direkt.

services:
  web:
    # Offizielles Shopware-Entwicklungsbild (PHP, Composer, Node, Caddy)
    image: ghcr.io/shopware/docker-dev:php8.3-node22-caddy
    env_file: .env
    ports:
      - "127.0.0.1:${SHOP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
      - zitadel-bootstrap:/zitadel-bootstrap:ro
    depends_on:
      database:
        condition: service_healthy

  worker:
    # Arbeitet die Warteschlange ab (Lizenz-Ereignisse mit Wiederholung) und startet geplante Aufgaben.
    # Wartet, bis make setup Shopware installiert hat (install.lock).
    image: ghcr.io/shopware/docker-dev:php8.3-node22-caddy
    env_file: .env
    volumes:
      - .:/var/www/html
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cd /var/www/html
        while [ ! -f install.lock ] || [ ! -f vendor/autoload.php ]; do sleep 5; done
        while true; do
          php bin/console scheduled-task:run --time-limit=60 --no-wait >/dev/null 2>&1
          php bin/console messenger:consume async low_priority ketteler_lizenz --time-limit=60 --memory-limit=256M -q || sleep 5
        done
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  database:
    # MySQL 8.4 wie auf Staging und Live (bis 12.10.2026 MariaDB 11.4)
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shopware
      MYSQL_USER: shopware
      MYSQL_PASSWORD: ${DB_PASSWORT:?DB_PASSWORT fehlt in .env, bitte make setup}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORT:?DB_ROOT_PASSWORT fehlt in .env, bitte make setup}
    command:
      - --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --log_bin_trust_function_creators=1
      - --group_concat_max_len=320000
      - --innodb_buffer_pool_size=512M
      - --default-time-zone=+00:00
      - --skip-log-bin
    volumes:
      - mysql-daten:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h127.0.0.1 -ushopware -e 'SELECT 1' shopware"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  mailer:
    # Fängt alle Mails ab (nichts geht nach außen): http://localhost:8025
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  zitadel-db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_DB_PASSWORT:?ZITADEL_DB_PASSWORT fehlt in .env, bitte make setup}
      POSTGRES_DB: zitadel
    volumes:
      - zitadel-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U zitadel"]
      interval: 5s
      timeout: 5s
      retries: 30

  zitadel:
    # Anmeldung wie später login.ketteler-verlag.de (gleiche Version wie das Redaktionssystem).
    # Lokal mit der eingebauten Anmeldeseite; Konsole: http://localhost:8080/ui/console
    image: ghcr.io/zitadel/zitadel:v4.19.4
    user: "0"
    command: start-from-init --masterkeyFromEnv --tlsMode disabled
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?ZITADEL_MASTERKEY fehlt in .env, bitte make setup}
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: ${ZITADEL_PORT:-8080}
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_DB_PASSWORT}@zitadel-db:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: KETTELER-lokal
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: de
      ZITADEL_FIRSTINSTANCE_ORG_NAME: KETTELER
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin@ketteler.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: zitadel-admin@ketteler.test
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORT:?ZITADEL_ADMIN_PASSWORT fehlt in .env, bitte make setup}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: ketteler-einrichtung
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Einrichtung (Dienstkonto)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/einrichtung.pat
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
    ports:
      - "127.0.0.1:${ZITADEL_PORT:-8080}:8080"
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s
    depends_on:
      zitadel-db:
        condition: service_healthy

  lizenz-attrappe:
    # Nachbildung von POST /api/shop/ereignisse des Redaktionssystems (nur lokal, prüft Format und Signatur)
    image: python:3.13-alpine
    environment:
      KETTELER_LIZENZ_GEHEIMNIS: ${KETTELER_LIZENZ_GEHEIMNIS:?KETTELER_LIZENZ_GEHEIMNIS fehlt in .env, bitte make setup}
      ATTRAPPE_DATEN: /daten
    command: ["python", "-u", "/app/attrappe.py"]
    volumes:
      - ./tools/lizenz-attrappe:/app:ro
      - lizenz-attrappe:/daten
    ports:
      - "127.0.0.1:${ATTRAPPE_PORT:-8090}:8090"

volumes:
  mysql-daten:
  zitadel-db:
  zitadel-bootstrap:
  lizenz-attrappe:
